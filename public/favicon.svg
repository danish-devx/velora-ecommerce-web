<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141414"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#c8ff00" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#c8ff00" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
    </pattern>
    <linearGradient id="fadeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridFade">
      <rect width="64" height="64" fill="url(#fadeGrad)"/>
    </mask>
    <linearGradient id="lime" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8ff4d"/>
      <stop offset="1" stop-color="#c8ff00"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="64" height="64" rx="10" fill="url(#bg)"/>
  <rect width="64" height="64" rx="10" fill="url(#grid)" mask="url(#gridFade)"/>
  <rect width="64" height="64" rx="10" fill="url(#glow)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="8" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- V monogram -->
  <path d="M13 17 L30 50 L47 17" fill="none" stroke="url(#lime)" stroke-width="7" stroke-linecap="square" stroke-linejoin="miter"/>

  <!-- notification / cart badge dot -->
  <circle cx="52" cy="11" r="7" fill="#c8ff00" opacity="0.2"/>
  <circle cx="52" cy="11" r="3.4" fill="#c8ff00"/>
</svg>